<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="100%" style="stop-color:#0b1628"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#4d9fff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g opacity="0.15" stroke="#4d9fff" stroke-width="1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Chart line (sparkline) -->
  <polyline 
    points="80,340 140,280 200,300 260,180 320,220 380,130 440,160"
    fill="none" stroke="url(#g1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Candle bodies -->
  <rect x="115" y="255" width="50" height="80" rx="6" fill="#00ff88" opacity="0.8"/>
  <rect x="235" y="155" width="50" height="100" rx="6" fill="#00ff88" opacity="0.8"/>
  <rect x="355" y="105" width="50" height="80" rx="6" fill="#4d9fff" opacity="0.8"/>

  <!-- Candle wicks -->
  <line x1="140" y1="230" x2="140" y2="255" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="335" x2="140" y2="360" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
  <line x1="260" y1="130" x2="260" y2="155" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
  <line x1="260" y1="255" x2="260" y2="280" stroke="#00ff88" stroke-width="5" stroke-linecap="round"/>
  <line x1="380" y1="80" x2="380" y2="105" stroke="#4d9fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="380" y1="185" x2="380" y2="210" stroke="#4d9fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Bottom text -->
  <text x="256" y="460" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#00ff88" opacity="0.9">AlgoTrade</text>
  <text x="256" y="492" text-anchor="middle" font-family="monospace" font-size="20" fill="#4d9fff" opacity="0.7">PRO</text>
</svg>
